<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PatitosBebés - Nidito</title>
    
    <!-- Configuración de Icono para Pantalla de Inicio -->
    <link rel="apple-touch-icon" href="./patitosbebe.png">
    <link rel="icon" type="image/png" href="./patitosbebe.png">
    <meta name="theme-color" content="#FFFBEB">
    
    <!-- Manifest para Android / PWA -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Pich%C3%B3nCare%22%2C%22short_name%22%3A%22Pichones%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFFBEB%22%2C%22theme_color%22%3A%22%23FFFBEB%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22./patitosbebe.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2png%22%7D%5D%7D">

    <!-- Fuente Nunito para estética cozy -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-pastel: #FFFBEB;
            --card-green: #E3F2E6;
            --border-brown: #8C6239;
            --border-brown-light: #C49A76;
            --text-brown: #4A3525;
            --text-muted: #735743;
            --btn-pink: #FAD2E1;
            --btn-pink-hover: #F8BBD0;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pastel);
            color: var(--text-brown);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed var(--border-brown-light);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tarjeta Principal del Nido */
        .nest-card {
            background-color: var(--card-green);
            border: 2px solid var(--border-brown);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(140, 98, 57, 0.08);
            margin-bottom: 20px;
        }

        .nest-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .chicks-badge-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .chick-tag {
            background-color: var(--white);
            border: 1.5px solid var(--border-brown-light);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-brown);
        }

        .timer-display {
            background: var(--white);
            border: 2px solid var(--border-brown);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .timer-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timer-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-brown);
            margin: 4px 0;
        }

        .timer-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Botón Gigante Toma Papilla */
        .btn-feed {
            background-color: var(--btn-pink);
            border: 2px solid var(--border-brown);
            color: var(--text-brown);
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-brown);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-feed:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border-brown);
        }

        /* Control de Jeringas */
        .syringe-box {
            background: var(--white);
            border: 2px solid var(--border-brown-light);
            border-radius: 14px;
            padding: 12px;
            margin-top: 12px;
            text-align: left;
        }

        .syringe-label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .syringe-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .syringe-btn {
            background: var(--card-green);
            border: 1.5px solid var(--border-brown);
            color: var(--text-brown);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .syringe-input {
            flex: 1;
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
            border: 1.5px solid var(--border-brown-light);
            border-radius: 10px;
            padding: 6px;
            background: var(--bg-pastel);
            color: var(--text-brown);
        }

        .syringe-quick-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .quick-btn {
            background: var(--bg-pastel);
            border: 1px solid var(--border-brown-light);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .quick-btn.active {
            background: var(--btn-pink);
            border-color: var(--border-brown);
            color: var(--text-brown);
        }

        /* Sección Historial */
        .history-section {
            background: var(--card-green);
            border: 2px solid var(--border-brown);
            border-radius: 20px;
            padding: 16px;
            flex: 1;
        }

        .history-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-item {
            background: var(--white);
            border: 1.5px solid var(--border-brown-light);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info .date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .history-info .detail {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-brown);
            margin-top: 2px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #C0392B;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }

        .btn-delete:hover {
            background: #FDEDEC;
        }

        .empty-history {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 24px;
            font-style: italic;
        }

        /* Notas adicionales */
        .notes-input {
            width: 100%;
            border: 1.5px solid var(--border-brown-light);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.85rem;
            background: var(--white);
            color: var(--text-brown);
            margin-top: 8px;
            resize: none;
        }
    </style>
</head>
<body>

    <header>
        <h1><i data-feather="heart" style="color: var(--btn-pink);"></i> PatitosBebé</h1>
        <p>Seguimiento grupal del nido</p>
    </header>

    <!-- Tarjeta Principal del Nido -->
    <div class="nest-card">
        <div class="nest-title">
            <i data-feather="home"></i> Nido Grupal (6 Pichones)
        </div>
        
        <div class="chicks-badge-container">
            <span class="chick-tag">🐥 2 Chiquitos</span>
            <span class="chick-tag">🐤 1 Mediano</span>
            <span class="chick-tag">🐦 3 Grandecitos</span>
        </div>

        <div class="timer-display">
            <div class="timer-label">Tiempo desde última toma</div>
            <div class="timer-value" id="elapsedTime">--:--</div>
            <div class="timer-sub" id="lastFeedTimeText">Sin registros aún</div>
        </div>

        <!-- Control de Jeringas -->
        <div class="syringe-box">
            <div class="syringe-label">
                <span><i data-feather="droplet" style="width: 14px; height: 14px;"></i> Cantidad de jeringa (5ml)</span>
                <span id="totalMlText" style="font-size: 0.75rem; color: var(--text-muted);">7.5 ml total</span>
            </div>
            <div class="syringe-controls">
                <button class="syringe-btn" onclick="adjustSyringe(-0.5)">-</button>
                <input type="number" id="syringeInput" class="syringe-input" value="1.5" step="0.25" min="0.25" max="10" onchange="updateSyringeText()">
                <button class="syringe-btn" onclick="adjustSyringe(0.5)">+</button>
            </div>
            <div class="syringe-quick-btns">
                <button class="quick-btn" onclick="setSyringe(1)">1 jeringa</button>
                <button class="quick-btn active" onclick="setSyringe(1.5)">1.5 (Predef.)</button>
                <button class="quick-btn" onclick="setSyringe(2)">2 jeringas</button>
                <button class="quick-btn" onclick="setSyringe(2.5)">2.5</button>
                <button class="quick-btn" onclick="setSyringe(3)">3 jeringas</button>
            </div>
            <textarea id="feedNotes" class="notes-input" placeholder="Observación opcional (ej: buche bien vacío, se devoraron todo)..." rows="2"></textarea>
        </div>

        <button class="btn-feed" onclick="recordFeeding()" style="margin-top: 16px;">
            <i data-feather="check-circle"></i> TOMA PAPILLA
        </button>
    </div>

    <!-- Historial -->
    <div class="history-section">
        <div class="history-title">
            <span><i data-feather="clock"></i> Historial de Tomas</span>
            <span id="historyCount" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">0 tomas</span>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-history">No hay tomas registradas hoy. ¡Toca el botón cuando les des de comer!</div>
        </div>
    </div>

    <script>
        feather.replace();

        let feedingHistory = JSON.parse(localStorage.getItem('pichoncare_history') || '[]');

        function initApp() {
            renderHistory();
            updateTimer();
            setInterval(updateTimer, 1000);
            updateSyringeText();
        }

        function setSyringe(val) {
            document.getElementById('syringeInput').value = val;
            document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateSyringeText();
        }

        function adjustSyringe(amount) {
            let input = document.getElementById('syringeInput');
            let val = parseFloat(input.value) || 0;
            val = Math.max(0.25, val + amount);
            input.value = val;
            updateSyringeText();
        }

        function updateSyringeText() {
            let val = parseFloat(document.getElementById('syringeInput').value) || 0;
            let totalMl = val * 5;
            document.getElementById('totalMlText').innerText = `${totalMl} ml total (${val} jeringa${val === 1 ? '' : 's'})`;
        }

        function recordFeeding() {
            const syringes = parseFloat(document.getElementById('syringeInput').value) || 1.5;
            const notes = document.getElementById('feedNotes').value.trim();
            const now = new Date();

            const newRecord = {
                id: Date.now(),
                timestamp: now.toISOString(),
                syringes: syringes,
                totalMl: syringes * 5,
                notes: notes
            };

            feedingHistory.unshift(newRecord);
            localStorage.setItem('pichoncare_history', JSON.stringify(feedingHistory));

            // Limpiar nota
            document.getElementById('feedNotes').value = '';

            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#FAD2E1', '#E3F2E6', '#8C6239']
            });

            renderHistory();
            updateTimer();
        }

        function deleteRecord(id) {
            if (confirm('¿Eliminar este registro?')) {
                feedingHistory = feedingHistory.filter(item => item.id !== id);
                localStorage.setItem('pichoncare_history', JSON.stringify(feedingHistory));
                renderHistory();
                updateTimer();
            }
        }

        function renderHistory() {
            const listEl = document.getElementById('historyList');
            const countEl = document.getElementById('historyCount');
            
            countEl.innerText = `${feedingHistory.length} toma${feedingHistory.length === 1 ? '' : 's'}`;

            if (feedingHistory.length === 0) {
                listEl.innerHTML = `<div class="empty-history">No hay tomas registradas aún. ¡Toca el botón cuando les des de comer!</div>`;
                return;
            }

            listEl.innerHTML = feedingHistory.map(item => {
                const date = new Date(item.timestamp);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString([], { day: '2-digit', month: '2-digit' });

                return `
                    <div class="history-item">
                        <div class="history-info">
                            <div class="date">${dateStr} - ⏰ ${timeStr}</div>
                            <div class="detail">💉 ${item.syringes} jeringa${item.syringes === 1 ? '' : 's'} (${item.totalMl} ml)</div>
                            ${item.notes ? `<div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">💬 ${item.notes}</div>` : ''}
                        </div>
                        <button class="btn-delete" onclick="deleteRecord(${item.id})">
                            <i data-feather="trash-2" style="width: 16px; height: 16px;"></i>
                        </button>
                    </div>
                `;
            }).join('');

            feather.replace();
        }

        function updateTimer() {
            const timerValEl = document.getElementById('elapsedTime');
            const lastTextEl = document.getElementById('lastFeedTimeText');

            if (feedingHistory.length === 0) {
                timerValEl.innerText = "--:--";
                lastTextEl.innerText = "Sin registros aún";
                return;
            }

            const lastTime = new Date(feedingHistory[0].timestamp).getTime();
            const now = new Date().getTime();
            const diffMs = now - lastTime;

            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const diffSecs = Math.floor((diffMs % (1000 * 60)) / 1000);

            timerValEl.innerText = `${String(diffHrs).padStart(2, '0')}:${String(diffMins).padStart(2, '0')}:${String(diffSecs).padStart(2, '0')}`;
            lastTextEl.innerText = `Última toma hace ${diffHrs}h ${diffMins}m`;
        }

        initApp();
    </script>
</body>
</html>
