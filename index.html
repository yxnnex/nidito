    <style>
        :root {
            --bg-cream: #FFFBEB;
            --bg-cream-alt: #FEF7D7;
            --sage-card: #E3F2E6;
            --sage-soft: #D6EBDA;
            --pink-btn: #FAD2E1;
            --pink-btn-hover: #F7BED4;
            --pink-soft: #FDE8F0;
            --brown-dark: #4A3525;
            --brown-mid: #735743;
            --brown-line: #8C6239;
            --brown-line-soft: #B8906D;
            --white-cream: #FFFDF7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-cream-alt) 100%);
            color: var(--brown-dark);
            min-height: 100vh;
            padding-bottom: 36px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Cabecera estilo captura */
        .top-bar {
            background-color: var(--sage-card);
            border: 1.5px solid var(--brown-line);
            border-top: none;
            border-bottom-left-radius: 26px;
            border-bottom-right-radius: 26px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 0 var(--brown-line);
            margin-bottom: 18px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nest-icon-box {
            width: 46px;
            height: 46px;
            background-color: var(--bg-cream);
            border: 1.5px solid var(--brown-line);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--brown-dark);
            line-height: 1.15;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cloud-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #B8906D;
            display: inline-block;
        }

        .cloud-dot.synced {
            background-color: #4CAF50;
            box-shadow: 0 0 0 2px var(--white-cream);
        }

        .brand-text p {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brown-mid);
            margin-top: 2px;
            text-transform: capitalize;
        }

        .btn-share {
            width: 42px;
            height: 42px;
            background-color: var(--pink-btn);
            border: 1.5px solid var(--brown-line);
            border-radius: 14px;
            color: var(--brown-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.15s ease;
            flex-shrink: 0;
        }

        .btn-share:active {
            transform: scale(0.94);
            background-color: var(--pink-btn-hover);
        }

        .main-content {
            padding: 0 16px;
        }

        /* Tarjetas en verde pastel con líneas marrón */
        .card {
            background-color: var(--sage-card);
            border: 1.5px solid var(--brown-line);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 3px 0 rgba(140, 98, 57, 0.25);
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1.5px dashed var(--brown-line-soft);
            gap: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--brown-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .total-badge {
            background-color: var(--bg-cream);
            border: 1.5px solid var(--brown-line);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--brown-dark);
        }

        .btn-mini-pink {
            background-color: var(--pink-btn);
            border: 1.5px solid var(--brown-line);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--brown-dark);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-mini-pink:active {
            transform: scale(0.95);
            background-color: var(--pink-btn-hover);
        }

        .chicks-pills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .chick-pill {
            background-color: var(--white-cream);
            border: 1.5px solid var(--brown-line);
            border-radius: 14px;
            padding: 8px 6px;
            text-align: center;
        }

        .chick-pill .emoji {
            font-size: 1.25rem;
            display: block;
            margin-bottom: 2px;
        }

        .chick-pill .count {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--brown-dark);
            display: block;
        }

        .chick-pill .label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--brown-mid);
        }

        /* Temporizador en vivo */
        .timer-box {
            background-color: var(--white-cream);
            border: 1.5px solid var(--brown-line);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
            margin-bottom: 14px;
        }
